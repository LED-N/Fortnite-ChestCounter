name: Build ChestCounter.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/ChestCounter/ChestCounter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = 'dist/ChestCounter.exe'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$exe.sha256" -Value "$hash  ChestCounter.exe`n" -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: ChestCounter
          path: |
            dist/ChestCounter.exe
            dist/ChestCounter.exe.sha256
          if-no-files-found: error
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ChestCounter.exe
            dist/ChestCounter.exe.sha256
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
